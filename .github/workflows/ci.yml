name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pti_user
          POSTGRES_PASSWORD: pti_pass
          POSTGRES_DB: pti_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pti_user" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t pti-api:ci backend

      - name: Run migrations (inside built image)
        run: |
          # Use host networking so the container can reach the postgres service
          docker run --rm --network host -e DB_HOST=localhost -e DB_PORT=5432 -e DB_NAME=pti_db -e DB_USER=pti_user -e DB_PASS=pti_pass pti-api:ci php /srv/backend/migrate.php

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build web client
        working-directory: web
        run: |
          npm ci
          npm run build
